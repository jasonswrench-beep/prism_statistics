<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrismStatistics Mockups</title>
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#151A3D; --deep:#0B0F2B; --ink:#151A3D; --muted:#565C80; --accent:#6555C4; --accent-ink:#4E3FB0;
  --paper:#FFFFFF; --wash:#F5F4FB; --line:#E3E2F0; --pill:#EDEAFB; --hover:#F1EFFA;
  --c1:#22C7EE; --c2:#3D7BF2; --c3:#7C5CF0; --c4:#E04FB3; --c5:#FF7A59; --c6:#FFB23E;
  --spectrum:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4),var(--c5),var(--c6));
  --info-bg:#EAF2FE; --info-line:#CFE0FB; --info-ink:#1F4FB8;
  --warn-bg:#FFF4E5; --warn-line:#F7D9A8; --warn-ink:#8A4B00;
  --ok-bg:#E8F6EE; --ok-line:#BFE5CF; --ok-ink:#17663A;
  --gen-bg:#F4F1FF; --gen-line:#D9D1FB;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
  --radius:12px; --shadow:0 1px 2px rgba(21,26,61,.06),0 4px 14px rgba(21,26,61,.06);
  --focus:0 0 0 3px rgba(101,85,196,.45);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--wash);color:var(--ink);font:14px/1.45 Inter,"Segoe UI",system-ui,sans-serif;font-feature-settings:"tnum" 0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.num{font-feature-settings:"tnum" 1;text-align:right}

/* ---------- app frame ---------- */
.app{display:grid;grid-template-rows:auto auto auto auto 1fr auto;height:100%;min-width:0;overflow:hidden}
.mock-strip{display:flex;align-items:center;gap:10px;justify-content:center;font-size:12px;color:#fff;background:var(--deep);padding:3px 12px;border-bottom:2px solid transparent;border-image:var(--spectrum) 1}
.mock-strip b{font-weight:600}
.titlebar{display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;height:44px;padding:0 6px 0 14px}
.titlebar .brand{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:.1px}
.titlebar .brand img{width:24px;height:24px}
.titlebar .sep{width:1px;height:18px;background:rgba(255,255,255,.25)}
.titlebar .proj{color:#D9DCF2}
.titlebar .saved{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#B4B9DA;margin-left:6px}
.titlebar .saved::before{content:"";width:7px;height:7px;border-radius:50%;background:#5FD49B}
.titlebar .win{margin-left:auto;display:flex}
.titlebar .win span{width:42px;height:44px;display:grid;place-items:center;color:#B4B9DA}
.menubar{display:flex;align-items:center;gap:2px;background:var(--paper);border-bottom:1px solid var(--line);padding:0 8px;height:38px;position:relative;z-index:30}
.menubar>.mb{position:relative}
.menubar>.mb>button{background:none;border:0;padding:6px 10px;border-radius:6px;cursor:pointer}
.menubar>.mb>button:hover,.menubar>.mb>button[aria-expanded="true"]{background:var(--hover)}
.menu{position:absolute;left:0;top:calc(100% + 4px);min-width:270px;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(21,26,61,.16);padding:6px;display:none}
.menu.open{display:block}
.menu [role=menuitem]{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:7px 10px;border-radius:6px;cursor:pointer;white-space:nowrap}
.menu [role=menuitem]:hover,.menu [role=menuitem]:focus{background:var(--pill);outline:none;box-shadow:none}
.menu [role=menuitem][aria-disabled="true"]{color:#9A9EBB;cursor:default}
.menu [role=menuitem][aria-disabled="true"]:hover{background:none}
.menu .kbd{margin-left:auto;color:var(--muted);font-size:12px}
.menu .later{margin-left:auto;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--muted)}
.menu .grp{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:8px 10px 2px}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.menu .sub{position:relative}
.menu .sub>.menu{left:100%;top:-7px}
.search{margin-left:auto;position:relative}
.search input{width:300px;max-width:32vw;border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 34px;background:var(--wash)}
.search svg{position:absolute;left:11px;top:8px;color:var(--muted);width:16px;height:16px}
.search .results{position:absolute;right:0;top:calc(100% + 6px);width:380px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(21,26,61,.16);padding:6px;display:none}
.search .results.open{display:block}
.search .results [role=option]{padding:8px 10px;border-radius:6px;cursor:pointer;display:flex;flex-direction:column}
.search .results [role=option][aria-selected="true"],.search .results [role=option]:hover{background:var(--pill)}
.search .results small{color:var(--muted)}
.toolbar{display:flex;align-items:center;gap:4px;background:var(--paper);border-bottom:1px solid var(--line);padding:4px 8px}
.tb{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid transparent;border-radius:8px;padding:5px 9px;cursor:pointer;color:var(--ink)}
.tb:hover{background:var(--hover)}
.tb.primary{color:var(--accent-ink)}
.tbsep{width:1px;height:20px;background:var(--line);margin:0 6px}

.body{display:grid;grid-template-columns:auto 1fr auto;min-height:0}
.rail{background:var(--paper);border-right:1px solid var(--line);width:168px;padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.rail button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-radius:9px;padding:8px 10px;cursor:pointer;text-align:left;color:var(--ink)}
.rail button:hover{background:var(--hover)}
.rail button[aria-current="page"]{background:var(--pill);color:var(--accent-ink);font-weight:600}
.rail .spacer{flex:1}
.rail.collapsed{width:56px}.rail.collapsed .lbl{display:none}

.main{min-width:0;min-height:0;display:flex;flex-direction:column}
.doctabs{display:flex;gap:4px;padding:0 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.doctabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px 9px;cursor:pointer;color:var(--muted);font-weight:500}
.doctabs button[aria-selected="true"]{color:var(--accent-ink);border-bottom-color:var(--accent)}
.view{flex:1;min-height:0;overflow:auto;padding:18px}

.dock{width:340px;background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.dock header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:600}
.dock header .x{margin-left:auto}
.dock .dockbody{padding:14px;overflow:auto;flex:1}
.iconbtn{background:none;border:0;border-radius:6px;padding:4px;cursor:pointer;color:var(--muted);display:inline-grid;place-items:center}
.iconbtn:hover{background:var(--hover);color:var(--ink)}

.ctxbar{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;background:var(--paper);border-top:1px solid var(--line);padding:6px 14px;font-size:12.5px;color:var(--muted)}
.ctxbar b{color:var(--ink);font-weight:600}
.ctxbar .chip{border:1px solid var(--line);border-radius:999px;padding:1px 8px;background:var(--wash)}

/* ---------- shared components ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:9px;border:1px solid var(--line);background:#fff;padding:8px 16px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--hover)}
.btn.primary{background:linear-gradient(180deg,#7465D6,#5A4ABC);border-color:#5A4ABC;color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.callout{display:flex;gap:10px;border:1px solid var(--info-line);background:var(--info-bg);border-radius:10px;padding:10px 12px;color:#17306E}
.callout svg{color:var(--c2);margin-top:1px}
.callout.warn{border-color:var(--warn-line);background:var(--warn-bg);color:#5A3100}.callout.warn svg{color:#C86B00}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;border:1px solid}
.status svg{width:14px;height:14px}
.status.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok-ink)}
.status.review{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-ink)}
.status.na{background:var(--wash);border-color:var(--line);color:var(--muted)}
.status.stale{background:#FDECEF;border-color:#F5C6CF;color:#9B1C34}
.placeholder{font-size:11px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;color:#8A4B00;background:var(--warn-bg);border:1px dashed #E4B76B;border-radius:6px;padding:1px 7px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.2px}
h1{font-size:28px}h2{font-size:18px}h3{font-size:15px}
.muted{color:var(--muted)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{color:var(--accent-ink);border-bottom-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:54px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:10px;box-shadow:var(--shadow);font-size:13px;z-index:90;display:none}
.toast.show{display:block}
.screens{position:fixed;right:16px;bottom:46px;z-index:80}
.screens>button{background:var(--navy);color:#fff;border:0;border-radius:999px;padding:8px 14px;box-shadow:var(--shadow);cursor:pointer;display:flex;gap:8px;align-items:center;font-weight:500}
.screens ol{position:absolute;right:0;bottom:calc(100% + 8px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(21,26,61,.16);padding:6px;margin:0;list-style:none;width:280px;display:none}
.screens ol.open{display:block}
.screens li button{width:100%;text-align:left;background:none;border:0;padding:7px 10px;border-radius:6px;cursor:pointer}
.screens li button:hover{background:var(--pill)}

/* ---------- welcome ---------- */
.welcome{max-width:1060px;margin:0 auto;position:relative}
.welcome .hero{display:flex;align-items:center;gap:18px;padding:18px 4px 22px}
.welcome .hero img{width:76px;height:76px}
.welcome .hero p{margin:6px 0 0;color:var(--muted);font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;height:118px;cursor:pointer;font-weight:600;border:1px solid var(--line);background:#fff;border-radius:var(--radius);box-shadow:var(--shadow)}
.tile svg{width:28px;height:28px;color:var(--accent)}
.tile:hover{border-color:#CFC8F3}
.tile.primary{background:linear-gradient(160deg,#7A6BDA,#5544B8);color:#fff;border-color:#5544B8}
.tile.primary svg{color:#fff}
.tile small{font-weight:400;color:var(--muted);margin-top:-6px}.tile.primary small{color:#E3DFFB}
.wgrid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-top:18px}
.wgrid .card{padding:16px}
.recent{list-style:none;margin:10px 0 0;padding:0}
.recent li{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px}
.recent li:hover{background:var(--wash)}
.recent .ic{width:36px;height:36px;border-radius:9px;background:var(--pill);display:grid;place-items:center;color:var(--accent)}
.recent .meta{font-size:12.5px;color:var(--muted)}
.recent .missing{font-size:12px;color:var(--warn-ink)}
.steps{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:4px}
.steps li{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px}
.steps li .n{width:24px;height:24px;border-radius:7px;background:var(--pill);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:700}
.steps li.done .n{background:var(--ok-bg);color:var(--ok-ink)}

/* ---------- data grid ---------- */
.gridwrap{height:100%;display:flex;flex-direction:column;gap:10px}
.gridbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pill);color:var(--accent-ink);font-weight:600}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.switch input{appearance:none;width:34px;height:20px;border-radius:999px;background:#CFCDE3;position:relative;cursor:pointer;transition:.15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.switch input:checked{background:var(--accent)}.switch input:checked::after{left:16px}
.gridscroll{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
table.dg{border-collapse:separate;border-spacing:0;font-size:13px;font-feature-settings:"tnum" 1}
table.dg th,table.dg td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 10px;white-space:nowrap;height:30px}
table.dg thead th{position:sticky;top:0;background:#FAF9FE;z-index:2;font-weight:600;text-align:left}
table.dg thead th small{display:block;font-weight:400;color:var(--muted);font-size:11px}
table.dg .rn{position:sticky;left:0;background:#FAF9FE;color:var(--muted);text-align:right;z-index:1;min-width:48px}
table.dg thead .rn{z-index:3}
table.dg td.id{position:sticky;left:48px;background:#fff;z-index:1;box-shadow:1px 0 0 var(--line)}
table.dg thead th.id{left:48px;z-index:3}
table.dg td:focus{outline:2px solid var(--accent);outline-offset:-2px;background:#F3F0FF;box-shadow:none;border-radius:0}
table.dg td.miss{color:#9A9EBB}
table.dg td.umiss{color:#9B5A00;font-style:italic}
table.dg td.lbl{font-style:italic}
.vv td{white-space:nowrap}
.vv input,.vv select{border:1px solid transparent;background:transparent;padding:3px 6px;border-radius:6px;width:100%}
.vv input:hover,.vv select:hover{border-color:var(--line)}
.measure{display:inline-flex;align-items:center;gap:6px}
.measure svg{width:15px;height:15px;color:var(--accent)}
.healthrow{display:flex;gap:10px;flex-wrap:wrap}
.health{font-size:12.5px;display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px}
.health svg{width:14px;height:14px}

/* ---------- dock: variables ---------- */
.varlist{list-style:none;margin:0;padding:0}
.varlist li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:default}
.varlist li:hover{background:var(--wash)}
.varlist li .lab{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.props dt{font-size:12px;color:var(--muted);margin-top:10px}
.props dd{margin:2px 0 0}

/* ---------- dialog ---------- */
.overlay{position:fixed;inset:0;background:rgba(11,15,43,.35);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.overlay.open{display:flex}
.dialog{width:min(820px,100%);max-height:calc(100vh - 40px);overflow:auto;background:#fff;border-radius:14px;box-shadow:0 24px 60px rgba(11,15,43,.35);border:1px solid var(--line)}
.dialog>header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dialog>header h2{font-size:17px}
.dialog>header .x{margin-left:auto}
.dialog .dbody{padding:16px 18px;display:grid;gap:14px}
.transfer{display:grid;grid-template-columns:1fr auto 1.15fr;gap:12px;align-items:start}
.listbox{border:1px solid var(--line);border-radius:10px;background:#fff;min-height:64px;padding:4px;list-style:none;margin:0}
.listbox.tall{height:310px;overflow:auto}
.listbox li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer}
.listbox li[aria-selected="true"]{background:var(--pill);color:var(--accent-ink)}
.listbox li .lab{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.listbox li .measure{margin-left:auto}
.listbox li.empty{color:#9A9EBB;font-style:italic;cursor:default}
.listbox:focus-within{border-color:#B9AFEE}
.rolecol{display:grid;gap:12px}
.role{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start}
.role .arrow{margin-top:24px}
.role label,.fieldlabel{font-weight:600;font-size:13px;display:block;margin-bottom:4px}
.role .hint,.fieldhint{font-weight:400;color:var(--muted);font-size:12px}
.arrowbtn{width:36px;height:32px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;display:grid;place-items:center;color:var(--accent-ink)}
.arrowbtn:hover{background:var(--pill)}
.groupsdef{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:13px}
.groupsdef select{border:1px solid var(--line);border-radius:7px;padding:4px 6px}
details.opt{border:1px solid var(--line);border-radius:10px;padding:0 12px}
details.opt>summary{cursor:pointer;padding:10px 0;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details.opt>summary::-webkit-details-marker{display:none}
details.opt>summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:.15s;margin-right:2px}
details.opt[open]>summary::before{transform:rotate(45deg)}
details.opt>summary .cur{font-weight:400;color:var(--muted);margin-left:auto;font-size:13px}
details.opt .optbody{padding:0 0 12px;display:grid;gap:8px}
.radio{display:flex;gap:8px;align-items:flex-start}
.radio input{margin-top:3px;accent-color:var(--accent)}
.inline-err{color:#9B1C34;font-size:12.5px;display:flex;gap:6px;align-items:flex-start}
.inline-err svg{width:15px;height:15px;color:#C0334F;margin-top:2px}
.dialog footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);background:#FBFAFE;border-radius:0 0 14px 14px}

/* ---------- output ---------- */
.outgrid{display:grid;grid-template-columns:230px 1fr;gap:16px;min-height:100%}
.outline{padding:10px}
.outline ul{list-style:none;margin:0;padding:0 0 0 12px}
.outline>ul{padding:0}
.outline li>button{background:none;border:0;padding:5px 8px;border-radius:7px;cursor:pointer;width:100%;text-align:left;display:flex;gap:6px;align-items:center}
.outline li>button:hover{background:var(--wash)}
.outline li>button[aria-current="true"]{background:var(--pill);color:var(--accent-ink);font-weight:600}
.result{padding:0;overflow:hidden}
.result>.rhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px 8px}
.result>.rhead h2 button{all:unset;cursor:pointer}
.result>.rhead h2 button:hover{text-decoration:underline;text-decoration-color:var(--accent)}
.result>.rhead h2 button:focus-visible{box-shadow:var(--focus);border-radius:4px}
.result .ractions{margin-left:auto;display:flex;gap:4px}
.result .rmeta{padding:0 16px 10px;color:var(--muted);font-size:12.5px}
.result .tabs{padding:0 10px}
.result .tabpanel{padding:16px}
table.apa{border-collapse:collapse;font-feature-settings:"tnum" 1;margin:6px 0 4px;min-width:520px}
table.apa caption{text-align:left;font-weight:600;padding-bottom:6px}
table.apa caption i{font-weight:400}
table.apa th,table.apa td{padding:5px 14px;text-align:right}
table.apa th:first-child,table.apa td:first-child{text-align:left;padding-left:0}
table.apa thead th{border-top:1.5px solid var(--ink);border-bottom:1px solid var(--ink);font-weight:600}
table.apa tbody tr:last-child td{border-bottom:1.5px solid var(--ink)}
.tnote{font-size:12.5px;color:var(--muted);max-width:760px;margin:4px 0 18px}
.diaglist{display:grid;gap:10px}
.diag{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px;border:1px solid var(--line);border-radius:10px}
.diag p{margin:0;color:var(--muted);font-size:13px;grid-column:1/-1}
.gen{border:1px solid var(--gen-line);background:var(--gen-bg);border-radius:10px;padding:12px 14px;position:relative}
.gen .tag{display:inline-flex;gap:6px;align-items:center;font-size:11.5px;font-weight:600;color:var(--accent-ink);margin-bottom:6px}
code.slot{font:12px var(--mono);background:#FFF4E5;border:1px solid #F7D9A8;border-radius:5px;padding:0 4px;color:#8A4B00}
.bound{background:#fff;border:1px solid var(--gen-line);border-radius:5px;padding:0 4px;font-feature-settings:"tnum" 1}
.studentbox textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical}
.boxplot text{font:12px Inter,sans-serif;fill:var(--muted)}

/* ---------- guide ---------- */
.gsteps{display:flex;gap:6px;margin-bottom:12px}
.gsteps span{flex:1;height:4px;border-radius:4px;background:var(--line)}
.gsteps span.on{background:var(--accent)}
.choice{display:grid;gap:8px;margin:10px 0}
.choice button{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;cursor:pointer}
.choice button:hover{border-color:#CFC8F3;background:#FCFBFF}
.choice button[aria-pressed="true"]{border-color:var(--accent);background:var(--pill)}
.choice button small{display:block;color:var(--muted)}
.answers{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);margin-top:14px;padding-top:10px}
.answers li{margin:2px 0}
.answers button{background:none;border:0;color:var(--accent-ink);cursor:pointer;padding:0;text-decoration:underline}

/* ---------- syntax ---------- */
.syn{display:grid;grid-template-columns:260px 1fr;gap:16px}
.hist{list-style:none;margin:0;padding:6px}
.hist li{display:flex;gap:8px;align-items:flex-start;padding:8px;border-radius:8px}
.hist li[aria-current="true"]{background:var(--pill)}
.hist li .n{font:12px var(--mono);color:var(--muted);margin-top:2px}
.hist li small{display:block;color:var(--muted)}
.panes{display:grid;gap:14px}
.pane{overflow:hidden}
.pane>header{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pane>header .eng{font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;border-radius:6px;padding:2px 8px}
.eng.prism{background:var(--pill);color:var(--accent-ink)}
.eng.r{background:#E6F4FB;color:#0B5F86}
.pane>header .acts{margin-left:auto;display:flex;gap:6px}
pre.code{margin:0;padding:14px;font:12.5px/1.6 var(--mono);overflow:auto;background:#FCFCFE;color:#2A2F55}
pre.code .k{color:#7C3AED}pre.code .s{color:#0F7A55}pre.code .c{color:#8A8FB0}pre.code .n{color:#B4530F}
.msgs{padding:10px 14px;font-size:13px;display:grid;gap:6px}

/* ---------- report ---------- */
.rep{display:grid;grid-template-columns:220px 1fr 260px;gap:16px;min-height:100%}
.repout ol{list-style:none;margin:0;padding:6px}
.repout li button{all:unset;display:block;padding:6px 10px;border-radius:7px;cursor:pointer;width:calc(100% - 20px)}
.repout li button:hover{background:var(--wash)}
.repout li button[aria-current="true"]{background:var(--pill);color:var(--accent-ink);font-weight:600}
.repout li ol{padding:0 0 0 14px}
.editor{padding:0;overflow:hidden}
.edbar{display:flex;gap:2px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.edbar select{border:1px solid var(--line);border-radius:7px;padding:4px 6px;margin-right:6px}
.edbar button{background:none;border:0;border-radius:6px;padding:5px 8px;cursor:pointer;font-weight:600}
.edbar button:hover{background:var(--hover)}
.page{padding:26px 34px;max-width:780px}
.page h2{font-size:20px;margin:0 0 10px}
.page p{margin:0 0 12px}
.page [contenteditable]{outline:none;border-radius:6px;padding:2px 4px;margin:-2px -4px}
.page [contenteditable]:focus{box-shadow:var(--focus)}
.checks{padding:12px}
.checks li{display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:13px}
.checks ul{list-style:none;margin:0;padding:0}
.checks svg{width:16px;height:16px;margin-top:2px}

@media (max-width:1100px){.dock{width:290px}.tiles{grid-template-columns:repeat(2,1fr)}.rep{grid-template-columns:1fr}.rep>.repout,.rep>.checkscard{display:none}}
@media (max-width:900px){.rail{width:56px}.rail .lbl{display:none}.dock{position:fixed;right:0;top:0;bottom:0;z-index:50;box-shadow:-8px 0 30px rgba(11,15,43,.2)}.outgrid,.syn{grid-template-columns:1fr}.outline{display:none}.wgrid{grid-template-columns:1fr}.transfer{grid-template-columns:1fr}.search input{width:170px}}
.result .ractions{flex-wrap:wrap}
.result .tabpanel,.wgrid .card{min-width:0;overflow-x:auto}
@media (max-width:700px){
  .titlebar .proj,.titlebar .sep{display:none}
  .menubar{flex-wrap:wrap;height:auto;padding-block:4px}
  .menubar>.mb{position:static}
  .menubar .menu{left:8px;right:8px;min-width:0;max-height:70vh;overflow-y:auto}
  .menu .sub>.menu{position:static;display:none;box-shadow:none;border:0;padding:0 0 0 12px}
  .menu .sub>.menu.open{display:block}
  .search{margin-left:0;width:100%;order:99;padding-bottom:2px}
  .search input{width:100%;max-width:none}
  .search .results{left:0;right:0;width:auto}
  .toolbar{flex-wrap:wrap}.tb span{display:none}
  .tiles{grid-template-columns:1fr 1fr}
  .recent li{flex-wrap:wrap}
  .welcome .hero{flex-wrap:wrap}
  .dock{width:min(340px,100vw)}
  .view{padding:14px}
  .page{padding:18px 16px}
  .screens{right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(46px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function menuItems(items){

  mb.querySelectorAll(".mb>button").forEach(b=>{
    b.addEventListener("click",e=>{const m=b.nextElementSibling;const was=m.classList.contains("open");closeAll();if(!was){m.classList.add("open");b.setAttribute("aria-expanded","true");m.querySelector("[role=menuitem]").focus()}});
    b.addEventListener("mouseenter",()=>{if(mb.querySelector(".mb>.menu.open")&&!b.nextElementSibling.classList.contains("open")){closeAll();b.nextElementSibling.classList.add("open");b.setAttribute("aria-expanded","true")}});
    b.addEventListener("keydown",e=>{const all=[...mb.querySelectorAll(".mb>button")];const i=all.indexOf(b);
      if(e.key==="ArrowRight"){e.preventDefault();all[(i+1)%all.length].focus()}
      if(e.key==="ArrowLeft"){e.preventDefault();all[(i-1+all.length)%all.length].focus()}
      if(e.key==="ArrowDown"){e.preventDefault();b.click()}});
  });
  mb.querySelectorAll("[data-sub]").forEach(b=>{
    const open=()=>{b.parentElement.parentElement.querySelectorAll(":scope>.sub>.menu.open").forEach(m=>m.classList.remove("open"));b.nextElementSibling.classList.add("open");b.setAttribute("aria-expanded","true")};
    b.addEventListener("mouseenter",open);b.addEventListener("click",e=>{e.stopPropagation();open();b.nextElementSibling.querySelector("[role=menuitem]").focus()});
  });
  mb.querySelectorAll(".menu").forEach(menu=>menu.addEventListener("keydown",e=>{
    const items=[...menu.querySelectorAll(":scope>[role=menuitem],:scope>.sub>[role=menuitem]")];const i=items.indexOf(document.activeElement);
    if(i<0)return;
    if(e.key==="ArrowDown"){e.preventDefault();e.stopPropagation();items[(i+1)%items.length].focus()}
    if(e.key==="ArrowUp"){e.preventDefault();e.stopPropagation();items[(i-1+items.length)%items.length].focus()}
    if(e.key==="ArrowRight"&&document.activeElement.hasAttribute("data-sub")){e.preventDefault();e.stopPropagation();document.activeElement.click()}
    if(e.key==="ArrowLeft"&&menu.parentElement.classList.contains("sub")){e.preventDefault();e.stopPropagation();menu.classList.remove("open");menu.previousElementSibling.focus()}
    if(e.key==="Escape"){e.preventDefault();e.stopPropagation();const top=menu.closest(".mb");closeAll();top.querySelector(":scope>button").focus()}
  }));
  mb.addEventListener("click",e=>{const t=e.target.closest("[role=menuitem][data-label]");if(!t)return;

function renderSearch(v){
  const res=document.getElementById("qres"),q=document.getElementById("q");v=v.trim().toLowerCase();
  if(!v){closeSearch();return}
  const hits=SEARCH.filter(s=>(s.name+" "+s.alias).toLowerCase().includes(v)).slice(0,7);
  res.innerHTML=hits.length?hits.map((h,i)=>`<div role="option" id="qo${i}" aria-selected="false" data-i="${SEARCH.indexOf(h)}"><span>${esc(h.name)}${h.later?' <span class="later" style="font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--muted)">Later release</span>':""}</span><small>${esc(h.path)}</small></div>`).join("")+`<div style="font-size:11.5px;color:var(--muted);padding:6px 10px 2px">Aliases help you find a procedure. They don't run another package's syntax or R code.</div>`:`<div style="padding:10px;color:var(--muted)">No matching procedure</div>`;
  res.classList.add("open");q.setAttribute("aria-expanded","true");
  res.querySelectorAll("[role=option]").forEach(o=>o.addEventListener("click",()=>{const s=SEARCH[+o.dataset.i];closeSearch();q.value="";
    if(s.later)toast(`${s.name} is planned for a later release.`);else if(s.act)doAct(s.act);else toast(`${s.name} isn't part of this mockup. Try the Independent-Samples T Test.`)}));
}
function closeSearch(){const r=document.getElementById("qres");if(r){r.classList.remove("open");document.getElementById("q").setAttribute("aria-expanded","false")}}

/* ======================== actions ======================== */
function doAct(act,label){
  switch(act){
    case"ttest":openTTest();break;
    case"guide":S.dock="guide";if(S.screen==="home")go("data");else render();break;
    case"dataview":S.dataMode="data";go("data");break;
    case"varview":S.dataMode="vars";go("data");break;
    case"output":go("output");break;case"syntax":go("syntax");break;case"report":go("report");break;case"learn":go("learn");break;
    case"labels":S.labels=!S.labels;go("data");break;
    case"dockvars":S.dock="variables";render();break;
    case"explain":if(S.hasResult){S.dock="explain";go("output")}else toast("Run an analysis first, then choose Explain this result.");break;
    case"rail":document.getElementById("rail").classList.toggle("collapsed");break;
    case"opendata":go("data");toast("In the real app, this opens the import preview (SCR02).");break;
    case"save":toast("Project saved.");break;
    case"rerun":if(S.hasResult){S.stale=false;S.version++;go("output");toast("Analysis run again from its saved settings.")}else toast("No analysis to run yet.");break;
    default:toast(`"${label||"This command"}" isn't part of this mockup.`);
  }
}
let tt;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),3800)}

/* ======================== shell ======================== */
const RAIL=[["home","Home","home"],["data","Data","data"],["output","Output","output"],["syntax","Syntax","syntax"],["report","Report","report"],["learn","Learn","learn"]];
function buildRail(){
  document.getElementById("rail").innerHTML=RAIL.map(([k,l,i])=>`<button data-go="${k}">${ic(i)}<span class="lbl">${l}</span></button>`).join("")+`<div class="spacer"></div><button data-go="settings">${ic("settings")}<span class="lbl">Settings</span></button>`;
  document.getElementById("rail").addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(!b)return;if(b.dataset.go==="settings"){toast("Settings (SCR12) isn't part of this mockup.");return}go(b.dataset.go)});
}
function buildToolbar(){
  const T=[["opendata","Open data","opendata"],["save","Save","save"],"|",["undo","Undo"],["redo","Redo"],"|",["vars","Variables","dockvars"],["run","Run","ttest","primary"],["bulb","Help me choose","guide"],"|",["info","Explain this result","explain"]];
  document.getElementById("toolbar").innerHTML=T.map(t=>t==="|"?'<span class="tbsep" aria-hidden="true"></span>':`<button class="tb ${t[3]||""}" data-act="${t[2]||""}" data-label="${t[1]}">${ic(t[0])}<span>${t[1]}</span></button>`).join("");
  document.getElementById("toolbar").addEventListener("click",e=>{const b=e.target.closest("button");if(b)doAct(b.dataset.act,b.dataset.label)});
}
function go(screen){S.screen=screen;if(["data","output","syntax","report"].includes(screen))S.doc=screen;render();document.getElementById("view").focus({preventScroll:true})}

function render(){
  const doc=["data","output","syntax","report"].includes(S.screen);
  document.querySelectorAll("#rail [data-go]").forEach(b=>b.toggleAttribute("aria-current",false));
  const cur=document.querySelector(`#rail [data-go="${S.screen}"]`);if(cur)cur.setAttribute("aria-current","page");
  document.getElementById("tbModule").textContent={home:"Home",data:S.dataMode==="vars"?"Variable View":"Data View",output:"Output",syntax:"Syntax",report:"Report",learn:"Learn"}[S.screen];
  const tabs=document.getElementById("doctabs");tabs.hidden=!doc;
  tabs.innerHTML=[["data","Data"],["output","Output"],["syntax","Syntax"],["report","Report"]].map(([k,l])=>`<button role="tab" aria-selected="${S.doc===k&&doc}" data-go="${k}">${l}</button>`).join("");
  tabs.onclick=e=>{const b=e.target.closest("[data-go]");if(b)go(b.dataset.go)};
  tabs.onkeydown=e=>{if(!["ArrowLeft","ArrowRight"].includes(e.key))return;const bs=[...tabs.querySelectorAll("button")];const i=bs.indexOf(document.activeElement);const n=bs[(i+(e.key==="ArrowRight"?1:-1)+bs.length)%bs.length];go(n.dataset.go);tabs.querySelector(`[data-go="${n.dataset.go}"]`).focus()};
  const v=document.getElementById("view");
  ({home:vHome,data:vData,output:vOutput,syntax:vSyntax,report:vReport,learn:vLearn})[S.screen](v);
  renderDock();renderCtx();
}
function renderCtx(){
  const n=ROWS.length;
  document.getElementById("ctxbar").innerHTML= S.screen==="home"?`<span>No dataset open in this view · Recent project: <b>Wellbeing Study</b></span>`:
  `<span>Dataset <b>wellbeing</b> <span class="chip">v3</span></span><span>Filter <b>none</b></span><span>Weight <b>none</b></span><span>Split <b>off</b></span><span>Cases <b>${n}</b> of ${n}</span>${S.screen==="output"&&S.hasResult?(R=>`<span>Analyzed in current result <b>${R.analyzed}</b> (${R.excl} excluded)</span>`)(calc()):""}<span style="margin-left:auto">Engine: Prism concept build · not validated</span>`;
}

function measureTag(m){const i={Scale:"scale",Ordinal:"ordinal",Nominal:"nominal",ID:"idv"}[m]||"scale";return `<span class="measure">${ic(i)}${m}</span>`}
function vData(v){
  const vars=VARS;
  v.innerHTML=`<div class="gridwrap">
   <div class="gridbar">
     <div class="seg" role="group" aria-label="Data editor view"><button aria-pressed="${S.dataMode==="data"}" data-m="data">Data View</button><button aria-pressed="${S.dataMode==="vars"}" data-m="vars">Variable View</button></div>
     ${S.dataMode==="data"?`<label class="switch"><input type="checkbox" id="lblsw" ${S.labels?"checked":""}> Show value labels</label><label class="switch"><input type="checkbox"> Browse only</label>`:""}
     <div class="healthrow" style="margin-left:auto" aria-label="Data health summary">
       <span class="health">${ic("check","")}<span>240 cases · 16 variables</span></span>
       <span class="health" style="color:var(--warn-ink)">${ic("warn")}<span>${ROWS.filter(r=>r.group===null).length} cases missing <b>group</b></span></span>
       <span class="health" style="color:var(--warn-ink)">${ic("warn")}<span>${ROWS.reduce((a,r)=>a+VARS.filter(v=>userMissing(v,r[v.name])).length,0)} user-missing codes</span></span>
     </div>
   </div>
   <div class="gridscroll" id="gs">${S.dataMode==="data"?dataTable(vars):varTable(vars)}</div>
   <div class="muted" style="font-size:12.5px">${S.dataMode==="data"?"Arrow keys move between cells. Missing values show as a dot (·); user-missing codes are shown in amber italics. Synthetic data generated for this mockup.":"Changing a name or label keeps the variable's identity, so analyses that use it stay linked. Edits here are recorded and can be undone."}</div>
  </div>`;
  v.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{S.dataMode=b.dataset.m;render()});
  const sw=v.querySelector("#lblsw");if(sw)sw.onchange=()=>{S.labels=sw.checked;render()};
  if(S.dataMode==="data")gridKeys(v.querySelector("table.dg"));
}
function cellVal(vr,val){
  if(val===null||val===undefined)return {t:"·",cls:"miss",sr:"system missing"};
  if(userMissing(vr,val))return {t:S.labels&&vr.values[val]?vr.values[val]:val,cls:"umiss",sr:"user-missing"};
  if(S.labels&&vr.values[val])return {t:vr.values[val],cls:"lbl"};
  return {t:val,cls:typeof val==="number"?"num":""};
}
function dataTable(vars){
  const head=`<thead><tr><th class="rn" scope="col"><span class="sr">Row</span></th>${vars.map((vr,j)=>`<th scope="col" class="${j===0?"id":""}" title="${esc(vr.label)}">${vr.name}<small>${esc(vr.label)}</small></th>`).join("")}</tr></thead>`;
  const body=ROWS.map((r,i)=>`<tr aria-rowindex="${i+2}"><th class="rn" scope="row">${i+1}</th>${vars.map((vr,j)=>{const c=cellVal(vr,r[vr.name]);return `<td class="${c.cls} ${j===0?"id":""}" tabindex="${i===0&&j===0?0:-1}">${esc(c.t)}${c.sr?`<span class="sr"> ${c.sr}</span>`:""}</td>`}).join("")}</tr>`).join("");
  return `<table class="dg" role="grid" aria-label="Data View: wellbeing, 240 cases, ${vars.length} variables" aria-rowcount="${ROWS.length+1}">${head}<tbody>${body}</tbody></table>`;
}
function gridKeys(t){
  t.addEventListener("keydown",e=>{const td=e.target.closest("td");if(!td)return;const tr=td.parentElement;const ci=[...tr.children].indexOf(td);let n=null;
    if(e.key==="ArrowRight")n=tr.children[ci+1];if(e.key==="ArrowLeft"&&ci>1)n=tr.children[ci-1];
    if(e.key==="ArrowDown")n=tr.nextElementSibling&&tr.nextElementSibling.children[ci];if(e.key==="ArrowUp")n=tr.previousElementSibling&&tr.previousElementSibling.children[ci];
    if(e.key==="Home")n=tr.children[1];if(e.key==="End")n=tr.lastElementChild;
    if(n&&n.tagName==="TD"){e.preventDefault();td.tabIndex=-1;n.tabIndex=0;n.focus()}});
}
function varTable(vars){
  const cols=["Name","Type","Format","Label","Values","Missing","Measure","Role","Units","Notes"];
  return `<table class="dg vv" aria-label="Variable View: ${vars.length} variables"><thead><tr><th class="rn" scope="col">#</th>${cols.map(c=>`<th scope="col">${c}</th>`).join("")}</tr></thead><tbody>${vars.map((vr,i)=>{
    const vals=Object.keys(vr.values).length?Object.entries(vr.values).slice(0,2).map(([k,l])=>`${k} = ${l}`).join("; ")+(Object.keys(vr.values).length>2?"; …":""):"None";
    return `<tr><th class="rn" scope="row">${i+1}</th><td><input aria-label="Name of variable ${i+1}" value="${vr.name}"></td><td>${vr.type}</td><td>${vr.fmt}</td><td style="min-width:220px"><input aria-label="Label for ${vr.name}" value="${esc(vr.label)}"></td><td><button class="btn" style="padding:2px 8px;font-size:12.5px;font-weight:400" aria-label="Edit value labels for ${vr.name}: ${esc(vals)}">${esc(vals)}</button></td><td>${vr.missing==="None"?"None":`<span style="color:var(--warn-ink)">${vr.missing}</span>`}</td><td>${measureTag(vr.measure)}</td><td>${vr.role}</td><td>${vr.units||""}</td><td class="muted" style="max-width:320px;overflow:hidden;text-overflow:ellipsis">${esc(vr.notes)}</td></tr>`}).join("")}</tbody></table>`;
}

/* ---------- dock ---------- */
function renderDock(){
  const d=document.getElementById("dock");
  if(S.screen==="home"||!S.dock||(S.dock==="explain"&&S.screen!=="output")){d.hidden=true;return}
  d.hidden=false;
  if(S.dock==="variables"){
    d.innerHTML=`<header>${ic("vars")}Variables<button class="iconbtn x" aria-label="Close Variables panel" data-x>${ic("close")}</button></header><div class="dockbody"><ul class="varlist">${VARS.map(v=>`<li>${measureTag(v.measure).replace(/(<\/svg>)\w+/,"$1")}<div style="min-width:0"><b>${v.name}</b><div class="lab">${esc(v.label)}</div></div></li>`).join("")}</ul>
    <dl class="props" style="border-top:1px solid var(--line);margin-top:10px;padding-top:4px"><dt>Selected</dt><dd><b>stress_mean</b> · Scale · Outcome</dd><dt>Defined by</dt><dd>Composite score, step 2 in History</dd><dt>Valid / missing</dt><dd>${ROWS.filter(r=>r.stress_mean!==null).length} / ${ROWS.filter(r=>r.stress_mean===null).length}</dd></dl></div>`;
  } else if(S.dock==="guide"){ d.innerHTML=guideHTML(); bindGuide(d); }
  else if(S.dock==="explain"){ d.innerHTML=explainHTML(); bindExplain(d); }
  else if(S.dock==="ai"){ d.innerHTML=aiPanelHTML(); bindAI(d); }
  const x=d.querySelector("[data-x]");if(x)x.onclick=()=>{S.dock=null;render()};
}

/* ---------- Help me choose ---------- */
function guideHTML(){
  const g=S.guide;const step=g.step;
  const bar=`<div class="gsteps" aria-hidden="true">${[0,1,2,3].map(i=>`<span class="${i<=step?"on":""}"></span>`).join("")}</div>`;
  let body="";
  if(step===0)body=`<h3>What are you trying to do?</h3><p class="muted" style="margin:4px 0 0">You can leave at any time. Your answers are saved with the project.</p><div class="choice">${[["compare","Compare groups","Do scores differ between groups or conditions?"],["relate","Look at a relationship","Do two measures go together?"],["describe","Describe my data","Averages, spreads, counts"],["predict","Predict an outcome","Several predictors at once"]].map(([k,t,s])=>`<button aria-pressed="${g.goal===k}" data-goal="${k}">${ic(k==="compare"?"compare":k==="relate"?"chart":k==="describe"?"data":"transform")}<span><b>${t}</b><small>${s}</small></span></button>`).join("")}</div>`;
  if(step===1)body=`<h3>What's the outcome you're comparing?</h3><p class="muted" style="margin:4px 0 0">Pick the measure you expect to differ.</p><div class="choice">${VARS.filter(v=>v.measure==="Scale"&&v.type!=="Date").map(v=>`<button aria-pressed="${g.outcome===v.name}" data-out="${v.name}">${ic("scale")}<span><b>${v.name}</b><small>${esc(v.label)} · Scale</small></span></button>`).join("")}</div>`;
  if(step===2)body=`<h3>How were the groups formed?</h3><p class="muted" style="margin:4px 0 0">This can't be worked out from the spreadsheet, so only you can answer it.</p><div class="choice">${[["indep","Different people in each group","e.g. Control vs. Treatment participants"],["paired","The same people measured twice","e.g. before and after, or matched pairs"],["cluster","Groups of people within sites, classes or families","Observations within a cluster may be related"]].map(([k,t,s])=>`<button aria-pressed="${g.design===k}" data-des="${k}">${ic(k==="indep"?"users":k==="paired"?"refresh":"nominal")}<span><b>${t}</b><small>${s}</small></span></button>`).join("")}</div>`;
  if(step===3){
    if(g.design==="cluster")body=`<h3>This design isn't supported yet</h3><div class="callout warn" style="margin-top:10px">${ic("warn")}<div>Comparing groups when people are clustered within sites needs a <b>multilevel (mixed) model</b>. That's planned for a later release. Running an ordinary t test here would treat related people as independent and understate the uncertainty, so PrismStatistics won't do that silently.</div></div><p style="margin-top:12px">What you can do now:</p><ul style="margin:0;padding-left:18px"><li>Export the data and settings for use in other software</li><li>Read the method page for mixed models (Help › Later releases)</li><li>Change your answer if the groups aren't clustered</li></ul>`;
    else if(g.design==="paired")body=`<h3>Suggested: Paired-Samples T Test</h3><p>The same people were measured twice, so the comparison should use each person's difference. <span class="muted">(Not part of this mockup. Choose “Different people” to continue.)</span></p>`;
    else body=`<h3>Suggested: Independent-Samples T Test</h3>
      <div class="callout" style="margin-top:10px">${ic("check")}<div><b>Why it fits:</b> you're comparing one Scale outcome (<b>${g.outcome||"stress_mean"}</b>) between two groups made of different people (<b>group</b>: Control, Treatment).</div></div>
      <p style="margin:12px 0 4px"><b>What the data can't tell us:</b> whether people were randomly assigned, or whether anyone could be in both groups. Those come from your study design.</p>
      <p style="margin:8px 0 4px"><b>Reasonable alternatives:</b></p><ul style="margin:0;padding-left:18px"><li>Mann-Whitney U if you're interested in rank ordering rather than means</li><li>Linear regression if you want to adjust for age</li></ul>
      <button class="btn primary" style="margin-top:14px;width:100%" data-openttest>${ic("run")}Open the T Test dialog with these roles</button>

function boxplot(R){
  const all=[...R.c.x,...R.t.x],mn=Math.floor(Math.min(...all)),mx=Math.ceil(Math.max(...all)),X=v=>60+(v-mn)/(mx-mn||1)*480;
  const ticks=[];for(let k=mn;k<=mx;k+=Math.max(1,Math.round((mx-mn)/5)))ticks.push(k);
  const one=(xs,y,lab,stroke,fill,med,dash)=>{const[,q1,q2,q3]=R.q(xs),iqr=q3-q1,lo=Math.min(...xs.filter(v=>v>=q1-1.5*iqr)),hi=Math.max(...xs.filter(v=>v<=q3+1.5*iqr));
    return `<text x="8" y="${y+4}">${esc(lab)}</text><line x1="${X(lo)}" y1="${y}" x2="${X(hi)}" y2="${y}" stroke="${stroke}" stroke-width="1.5"/><line x1="${X(lo)}" y1="${y-7}" x2="${X(lo)}" y2="${y+7}" stroke="${stroke}" stroke-width="1.5"/><line x1="${X(hi)}" y1="${y-7}" x2="${X(hi)}" y2="${y+7}" stroke="${stroke}" stroke-width="1.5"/><rect x="${X(q1)}" y="${y-14}" width="${X(q3)-X(q1)}" height="28" rx="4" fill="${fill}" stroke="${stroke}" stroke-width="1.5" ${dash?'stroke-dasharray="5 3"':""}/><line x1="${X(q2)}" y1="${y-14}" x2="${X(q2)}" y2="${y+14}" stroke="${med}" stroke-width="2.5"/>`};
  const [, ,m1]=R.q(R.c.x),[, ,m2]=R.q(R.t.x);
  return `<svg class="boxplot" viewBox="0 0 560 170" role="img" aria-label="Boxplots of ${esc(R.ylab)} by group. ${esc(R.lab1)} median ${f2(m1)}, ${esc(R.lab2)} median ${f2(m2)}." style="max-width:560px">
    <line x1="60" y1="140" x2="540" y2="140" stroke="#C9C7DD"/>${ticks.map(k=>`<line x1="${X(k)}" y1="140" x2="${X(k)}" y2="145" stroke="#C9C7DD"/><text x="${X(k)}" y="160" text-anchor="middle">${k}</text>`).join("")}
    ${one(R.c.x,48,R.lab1,"#6555C4","#EDEAFB","#4E3FB0",false)}${one(R.t.x,102,R.lab2,"#3D7BF2","#E6EEFD","#1F4FB8",true)}</svg>`;
}

    ${A.status==="draft"?`<div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap"><button class="btn primary" style="padding:5px 12px" data-ai="accept">${ic("check")}Accept</button><button class="btn" style="padding:5px 12px" data-ai="edit">${ic("pen")}Edit</button><button class="btn" style="padding:5px 12px" data-ai="template">Use template version</button><button class="btn" style="padding:5px 12px" data-ai="discard">Discard</button></div>`:""}
  </div>`;
}

function vReport(v){
  const R=calc();
  v.innerHTML=`<div class="rep">
   <nav class="card repout" aria-label="Report outline"><div style="display:flex;align-items:center;gap:8px;padding:12px 14px 4px"><h3>Report outline</h3></div><ol>
     <li><button>1. Introduction</button></li><li><button>2. Method</button></li><li><button>3. Results</button><ol><li><button aria-current="true">3.1 Stress by group</button></li><li><button>3.2 Wellbeing by group</button></li></ol></li><li><button>4. Discussion</button></li><li><button>References</button></li></ol>
     <div style="padding:6px 12px 12px"><button class="btn" style="width:100%">${ic("plus")}Add section</button></div></nav>
   <article class="card editor">
     <div class="edbar" role="toolbar" aria-label="Formatting"><select aria-label="Paragraph style"><option>Heading 2</option><option>Normal</option></select><button aria-label="Bold">B</button><button aria-label="Italic"><i>I</i></button><button aria-label="Underline"><u>U</u></button><span class="tbsep"></span><button aria-label="Insert link">${ic("link")}</button><button aria-label="Insert table">${ic("data")}</button><button aria-label="Insert figure">${ic("chart")}</button><span class="tbsep"></span><button data-aiopen style="display:inline-flex;gap:6px;align-items:center;color:var(--accent-ink)">${ic("sparkle")}Write up with AI</button><span style="margin-left:auto;display:flex;gap:8px;align-items:center"><span class="status ok">${ic("check")}Live: follows latest results</span><button class="btn" style="padding:4px 10px" data-freeze>Freeze snapshot</button></span></div>
     <div class="page">
       <h2 contenteditable="true">3.1 Stress by group</h2>
       <p contenteditable="true">We expected participants in the treatment program to report lower stress than those in the control group.</p>
       ${aiBlock(R)}
       ${S.ai.state==="done"&&S.ai.status!=="discarded"?`<p class="muted" style="font-size:12.5px;margin:-6px 0 14px">Template version hidden while the AI text is used. <a href="#" data-ai="template">Switch back</a></p>`:`<div class="gen" style="margin:6px 0 14px">${S.stale?`<div class="status stale" style="margin-bottom:6px">${ic("refresh")}Needs review: result changed</div>`:""}<div class="tag">${ic("sparkle")}Generated statement · bound to Independent-Samples T Test v${S.version} · edits become author text</div><p style="margin:0">${S.hasResult?interpText():"<i>Run the analysis to fill in this statement.</i>"}</p></div>`}
       <table class="apa" style="margin-top:8px"><caption>Table 1 <i>Stress score by group</i></caption><thead><tr><th>Group</th><th>n</th><th>M</th><th>SD</th></tr></thead><tbody><tr><td>${esc(R.lab1)}</td><td>${R.c.n}</td><td>${f2(R.c.m)}</td><td>${f2(R.c.sd)}</td></tr><tr><td>${esc(R.lab2)}</td><td>${R.t.n}</td><td>${f2(R.t.m)}</td><td>${f2(R.t.sd)}</td></tr></tbody></table>
       <p class="tnote">Note. N = ${R.total}; ${exclNote(R)}. ${S.estimator==="welch"?"Welch's":"Student's"} t test, two-sided.</p>
       <p contenteditable="true" style="border-left:3px solid var(--line);padding-left:10px;color:var(--muted)">Author text: add your discussion of what this difference means for the program here.</p>
     </div></article>
   <aside class="card checks checkscard" aria-labelledby="ckT"><h3 id="ckT">Export checks</h3><ul style="margin-top:8px">
     <li style="color:var(--ok-ink)">${ic("check")}<span>All numbers bound to current results</span></li>
     <li style="color:var(--ok-ink)">${ic("check")}<span>Sample sizes and missing data stated</span></li>
     <li style="color:var(--warn-ink)">${ic("warn")}<span>Figure 1 has no alt text. <a href="#" onclick="toast('Opens the alt text editor for Figure 1.');return false">Add alt text</a></span></li>
     <li style="color:var(--warn-ink)">${ic("warn")}<span>Method citation for Hedges' g missing</span></li>
     ${S.stale?`<li style="color:#9B1C34">${ic("warn")}<span><b>Stale result in 3.1.</b> Run again before a final export.</span></li>`:""}
     ${S.ai.state==="done"&&S.ai.status==="draft"?`<li style="color:#9B1C34">${ic("warn")}<span><b>AI draft in 3.1 not reviewed.</b> Accept or edit it before a final export.</span></li>`:""}
    </ul>
    <div style="display:grid;gap:8px;margin-top:12px"><button class="btn primary" data-ex="DOCX">${ic("export")}Export DOCX</button><button class="btn" data-ex="HTML">${ic("export")}Export accessible HTML</button><button class="btn" disabled title="Planned after accessibility tagging is verified">PDF: later release</button></div>
    <p class="muted" style="font-size:12px;margin-top:10px">Exports include the software version, settings and data fingerprint.</p></aside>
  </div>`;
  v.querySelector("[data-aiopen]").onclick=()=>{if(!S.hasResult){toast("Run an analysis first. The AI writer only reads finished results.");return}S.dock="ai";renderDock();focusDock()};
  v.querySelectorAll("[data-ai]").forEach(b=>b.onclick=e=>{e.preventDefault();const a=b.dataset.ai;
    if(a==="accept"){S.ai.status="accepted";toast("Marked as reviewed. Numbers stay linked to result v"+S.version+".")}
    if(a==="edit"){S.ai.status="edited";toast("You can now edit the text. Edited AI text is stored as author text in the process record.")}
    if(a==="discard"||a==="template"){S.ai.status="discarded";toast(a==="template"?"Using the template version.":"AI draft discarded.")}
    render();if(a==="edit"){const t=document.querySelector("[data-aitext]");t&&t.focus()}});
  v.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>toast(S.ai.state==="done"&&S.ai.status==="draft"?`Can't make a final ${b.dataset.ex} export while the AI draft is unreviewed.`:S.stale?`Can't make a final ${b.dataset.ex} export while a result is stale. Run it again first, or export as a labeled draft.`:`Exported Wellbeing Study report.${b.dataset.ex.toLowerCase()} (2 warnings acknowledged).`));
  v.querySelector("[data-freeze]").onclick=()=>toast("Frozen snapshot saved. It keeps result version "+S.version+" even if the analysis changes later.");
}

function vLearn(v){
  v.innerHTML=`<div style="max-width:900px;margin:0 auto"><h1 style="margin:6px 0 4px">Learn</h1><p class="muted">Worked examples, a glossary, and migration guides. Not part of this mockup's test tasks.</p>
   <div class="tiles" style="margin-top:16px;grid-template-columns:repeat(3,1fr)">${[["Worked example: comparing two groups","learn"],["Glossary","text"],["Migration guide: menu-driven packages","transform"],["Migration guide: command-driven packages","transform"],["Migration guide: from JASP","transform"],["Statistical defaults compared","compare"]].map(([t,i])=>`<button class="tile" onclick="toast('${t.replace(/'/g,"")} isn\\'t part of this mockup.')">${ic(i)}${t}</button>`).join("")}</div></div>`;
}

/* ======================== screens jump list ======================== */
const SCREENS=[
 ["1 · Welcome",()=>{S.dock="variables";go("home")}],
 ["2 · Data View",()=>{S.dataMode="data";S.dock="variables";go("data")}],
 ["2 · Variable View",()=>{S.dataMode="vars";S.dock="variables";go("data")}],
 ["3 · T test dialog",()=>{S.dataMode="data";go("data");openTTest()}],
 ["4 · Output",()=>{S.hasResult=true;S.dlg.tests=S.dlg.tests.length?S.dlg.tests:["stress_mean"];S.dlg.group=S.dlg.group||"group";S.dock="explain";go("output")}],
 ["5 · Help me choose",()=>{S.dataMode="data";S.guide={step:0,goal:null,outcome:null,design:null};S.dock="guide";go("data")}],
 ["6 · Syntax",()=>{S.hasResult=true;S.dock=null;go("syntax")}],
 ["7 · Report builder",()=>{S.hasResult=true;S.dock=null;go("report")}],
 ["8 · Write up with AI",()=>{S.hasResult=true;S.dock="ai";go("report")}]
];
function buildScreens(){
  const l=document.getElementById("screensList"),b=document.getElementById("screensBtn");
  l.innerHTML=SCREENS.map((s,i)=>`<li><button data-s="${i}">${s[0]}</button></li>`).join("");
  b.onclick=e=>{e.stopPropagation();const o=l.classList.toggle("open");b.setAttribute("aria-expanded",o)};
  l.onclick=e=>{const x=e.target.closest("[data-s]");if(!x)return;l.classList.remove("open");b.setAttribute("aria-expanded","false");closeDialog();SCREENS[+x.dataset.s][1]()};
}

/* ======================== keyboard shortcuts ======================== */
document.addEventListener("keydown",e=>{
  const ctrl=e.ctrlKey||e.metaKey;
  if(ctrl&&e.key.toLowerCase()==="k"){e.preventDefault();document.getElementById("q").focus()}
  else if(ctrl&&e.shiftKey&&e.key.toLowerCase()==="h"){e.preventDefault();doAct("guide")}
  else if(ctrl&&e.key.toLowerCase()==="t"&&!e.shiftKey){e.preventDefault();S.dataMode=S.dataMode==="data"?"vars":"data";go("data")}
  else if(ctrl&&["1","2","3","4"].includes(e.key)){e.preventDefault();go(["data","output","syntax","report"][+e.key-1])}
  else if(e.key==="F10"){e.preventDefault();document.getElementById("mb0").focus()}
  else if(e.key==="Escape"&&document.querySelector(".menu.open")){document.querySelectorAll(".menu.open").forEach(m=>m.classList.remove("open"))}
});

buildMenubar();buildRail();buildToolbar();buildScreens();render();
</script>
