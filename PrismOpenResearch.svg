<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Prism Open Research</title>
  <desc id="description">Luminous rainbow faceted triangular prism with an open center and a separated gold corner. Editable paths and gradients on a transparent 1024 by 1024 square.</desc>
  <!-- Editable vector recreation of the approved concept. Transparent square canvas. -->
  <defs><linearGradient id="left-beam" gradientUnits="userSpaceOnUse" x1="120" y1="850" x2="505" y2="128"><stop offset="0" stop-color="#00E8D6" stop-opacity="1"/><stop offset="0.36" stop-color="#00DCEF" stop-opacity="1"/><stop offset="0.72" stop-color="#009BF2" stop-opacity="1"/><stop offset="1" stop-color="#597DFF" stop-opacity="1"/></linearGradient><linearGradient id="left-outer" gradientUnits="userSpaceOnUse" x1="110" y1="790" x2="505" y2="128"><stop offset="0" stop-color="#45FFF0" stop-opacity="1"/><stop offset="0.52" stop-color="#22DAF1" stop-opacity="1"/><stop offset="1" stop-color="#7DDBFF" stop-opacity="1"/></linearGradient><linearGradient id="right-beam" gradientUnits="userSpaceOnUse" x1="505" y1="128" x2="866" y2="760"><stop offset="0" stop-color="#6578FF" stop-opacity="1"/><stop offset="0.27" stop-color="#7632F3" stop-opacity="1"/><stop offset="0.56" stop-color="#D63CD0" stop-opacity="1"/><stop offset="0.78" stop-color="#FF618C" stop-opacity="1"/><stop offset="1" stop-color="#FF961A" stop-opacity="1"/></linearGradient><linearGradient id="right-inner" gradientUnits="userSpaceOnUse" x1="505" y1="340" x2="830" y2="780"><stop offset="0" stop-color="#3532DA" stop-opacity="1"/><stop offset="0.34" stop-color="#7F22D4" stop-opacity="1"/><stop offset="0.65" stop-color="#EC379A" stop-opacity="1"/><stop offset="1" stop-color="#FF641A" stop-opacity="1"/></linearGradient><linearGradient id="base" gradientUnits="userSpaceOnUse" x1="76" y1="832" x2="742" y2="832"><stop offset="0" stop-color="#00D5D4" stop-opacity="1"/><stop offset="0.35" stop-color="#13D9B7" stop-opacity="1"/><stop offset="0.62" stop-color="#D8D54F" stop-opacity="1"/><stop offset="0.84" stop-color="#FFA900" stop-opacity="1"/><stop offset="1" stop-color="#FFDC00" stop-opacity="1"/></linearGradient><linearGradient id="base-bright" gradientUnits="userSpaceOnUse" x1="76" y1="872" x2="742" y2="779"><stop offset="0" stop-color="#4EFFF1" stop-opacity="1"/><stop offset="0.43" stop-color="#59EBD5" stop-opacity="