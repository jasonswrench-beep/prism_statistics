[package]
name = "prism-ai"
description = "The optional AI writer: a small local model drafts APA paragraphs whose numbers come only from verified results."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
prism-engine = { path = "../prism-engine" }
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
sha2 = "0.10.9"
# llama.cpp, built from source: needs CMake and libclang (LLVM) when building PrismStatistics. See the README.
llama-cpp-2 = { version = "=0.1.160", default-features = false }
llama-cpp-sys-2 = "=0.1.160"
