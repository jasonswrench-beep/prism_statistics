[workspace]
resolver = "2"
members = [
    "crates/prism-engine",
    "crates/prism-api",
    "crates/prism-cli",
    "crates/prism-pdf",
    "crates/prism-ai",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
authors = ["PrismStatistics contributors"]

[workspace.dependencies]
# The statistics shared with PrismQDA (decision D03), published from openstage-core (`crates/prismqda-stats`) and
# pinned to a tag there, so a change never moves PrismStatistics' numbers without a deliberate update. A new tag is
# taken only with `python tools/validate.py` passing. 1.0.0 is PrismQDA's copy at 56a161e, unchanged.
# The core repository is public; .cargo/config.toml has cargo fetch it with git.
prismqda-stats = { git = "https://github.com/jasonswrench-beep/openstage-core", tag = "prismqda-stats-v1.0.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.4"
thiserror = "2"
tiny_http = "0.12"
calamine = "0.38.0"
ambers = { version = "0.4.7", default-features = false }
arrow-array = "57.3"
arrow-schema = "57.3"
dta = { version = "0.6.0", default-features = false }
sas7bdat = { version = "0.9.3", default-features = false }
rusqlite = { version = "0.41.1", features = ["bundled"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
base64 = "0.22"
ureq = "3.5.0"
typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
typst-assets = { version = "=0.15.1", features = ["fonts"] }
# Charts: SVG text to outlines (for the PDF) and SVG to PNG (for Word). The version Typst already uses.
resvg = "0.47"
# Chart pictures from project files are rebuilt from an allowlist (prism-engine svg_clean.rs). The version usvg uses.
roxmltree = "0.21"

[profile.release]
lto = "thin"
codegen-units = 1
